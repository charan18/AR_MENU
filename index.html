<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AR Cafe | Digital Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        model-viewer::part(default-ar-button) { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: #f97316; color: white; border-color: #f97316; }
        .hero-gradient { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .cart-drawer { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased">

    <!-- AR OVERLAYS -->
    <div id="ar-loading" class="hidden fixed inset-0 bg-black/90 z-[600] flex flex-col items-center justify-center text-white">
        <div class="w-10 h-10 border-4 border-white/20 border-t-orange-500 rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-bold uppercase tracking-widest">Warming up AR...</p>
    </div>

    <!-- 1. HERO SECTION -->
    <header class="relative h-64 w-full bg-zinc-900 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=800" class="w-full h-full object-cover opacity-60">
        <div class="absolute inset-0 hero-gradient"></div>
        <div class="absolute bottom-0 left-0 p-6">
            <div class="flex items-center gap-2 mb-2">
                <span class="bg-green-500 w-2 h-2 rounded-full"></span>
                <span class="text-white text-[10px] font-bold uppercase tracking-widest">Live Menu</span>
            </div>
            <h1 id="res-name" class="text-3xl font-black text-white italic tracking-tighter uppercase">THE SMART CAFE</h1>
            <p class="text-zinc-300 text-xs mt-1">Premium Photogrammetry Dining Experience</p>
        </div>
    </header>

    <!-- 2. CATEGORY PILLS -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-zinc-100 py-4">
        <div id="category-bar" class="flex gap-2 overflow-x-auto px-6 no-scrollbar">
            <!-- Injected -->
        </div>
    </nav>

    <!-- 3. PRODUCT GRID -->
    <main class="p-6 pb-32">
        <div id="menu-container" class="grid grid-cols-1 gap-10 max-w-md mx-auto">
            <!-- Injected -->
        </div>
    </main>

    <!-- 4. STICKY CART FOOTER -->
    <div id="cart-footer" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-zinc-900 text-white rounded-3xl p-4 shadow-2xl flex justify-between items-center z-[100] cart-drawer border border-white/10">
        <div class="flex items-center gap-4">
            <div class="bg-orange-500 p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div>
                <p id="cart-items-text" class="text-[10px] font-bold uppercase tracking-widest text-zinc-400">0 Items</p>
                <p id="cart-total" class="font-black text-lg">£0.00</p>
            </div>
        </div>
        <button onclick="proceedToCheckout()" class="bg-white text-black px-6 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-transform">
            Checkout
        </button>
    </div>

    <script>
        let menuData = null;
        let activeCategory = "All";
        let cart = [];
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || "TBD";

        async function init() {
            const res = await fetch('data.json');
            menuData = await res.json();
            
            // Auto-generate unique categories from the JSON
            const categoriesFromData = [...new Set(menuData.dishes.map(d => d.category || d.type))];
            menuData.categories = ["All", ...categoriesFromData];
            
            document.getElementById('res-name').innerText = menuData.restaurant;
            
            // Add Table Badge
            const tableBadge = document.createElement('div');
            tableBadge.className = "absolute top-4 right-4 bg-orange-600 text-white text-[10px] font-black px-3 py-1 rounded-full z-[100]";
            tableBadge.innerText = `TABLE ${tableNumber}`;
            document.querySelector('header').appendChild(tableBadge);

            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const bar = document.getElementById('category-bar');
            bar.innerHTML = '';
            menuData.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2 rounded-xl border border-zinc-200 text-[10px] font-black tracking-widest transition-all whitespace-nowrap ${activeCategory === cat ? 'active-tab' : 'bg-white text-zinc-400'}`;
                btn.innerText = cat.toUpperCase();
                btn.onclick = () => { activeCategory = cat; renderCategories(); renderMenu(); };
                bar.appendChild(btn);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            const filtered = activeCategory === "All" ? menuData.dishes : menuData.dishes.filter(d => (d.category || d.type) === activeCategory);

            filtered.forEach(dish => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2.5rem] p-2 border border-zinc-100 shadow-sm overflow-hidden";
                card.innerHTML = `
                    <div class="relative h-80 rounded-[2rem] overflow-hidden bg-zinc-50 border border-zinc-50">
                        <model-viewer src="${dish.glb}" ios-src="${dish.usdz}" ar ar-placement="floor" ar-scale="fixed" camera-controls touch-action="pan-y" 
                        loading="eager" environment-image="neutral" shadow-intensity="2" class="w-full h-full">
                            <button slot="ar-button" class="absolute bottom-4 right-4 bg-white p-4 rounded-full shadow-xl border border-zinc-100 active:scale-90 transition-transform">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                            </button>
                        </model-viewer>
                        <div class="absolute top-4 left-4 bg-black/50 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                            <span class="text-white text-[8px] font-black uppercase tracking-tighter">Life Scale 1:1</span>
                        </div>
                    </div>
                    <div class="p-4 flex justify-between items-end">
                        <div class="flex-1 pr-4">
                            <p class="text-orange-500 text-[10px] font-black uppercase tracking-widest mb-1">${dish.type || dish.category}</p>
                            <h3 class="text-xl font-black italic tracking-tighter uppercase leading-none mb-1">${dish.name}</h3>
                            <p class="text-zinc-400 text-[10px] font-bold uppercase tracking-tighter leading-tight">Cal: ${dish.calories} • ${dish.allergens}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black tracking-tighter mb-2">£${dish.price}</p>
                            <button onclick="addToCart('${dish.name}', ${dish.price})" class="bg-zinc-900 text-white p-3 rounded-2xl active:scale-90 transition-transform">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(name, price) {
            cart.push({name, price});
            const footer = document.getElementById('cart-footer');
            footer.classList.remove('hidden');
            document.getElementById('cart-items-text').innerText = `${cart.length} Items`;
            const total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
            document.getElementById('cart-total').innerText = `£${total.toFixed(2)}`;
        }

        function proceedToCheckout() {
            const total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0).toFixed(2);
            alert(`Order Sent to Kitchen!\nTable: ${tableNumber}\nTotal: £${total}\n\nOur waiter will be with you shortly.`);
        }

        init();
    </script>
</body>
</html>
