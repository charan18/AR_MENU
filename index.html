<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart AR Menu</title>
    <!-- Core Frameworks: A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Tailwind CSS for smooth modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: #f97316; color: white; border-color: #f97316; }
        #scanning-overlay {
            position: fixed; inset: 0; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .scanner-box {
            width: 260px; height: 260px;
            border: 4px dashed #f97316; border-radius: 28px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.04); opacity: 1; }
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 font-sans antialiased overflow-x-hidden">

    <!-- FRONTEND SCANNING GUIDE -->
    <div id="scanning-overlay">
        <div class="scanner-box"></div>
        <p class="text-white text-center mt-6 px-8 text-sm font-black tracking-tight drop-shadow">
            POINT CAMERA DIRECTLY AT<br>THE <span class="text-orange-500">TABLE QR CODE</span>
        </p>
    </div>

    <!-- FLOATING INTERACTIVE UI -->
    <div id="ui-layer" class="relative z-50 pointer-events-none min-h-screen flex flex-col justify-between">
        
        <!-- Header: Dynamic Restaurant Title & Table ID -->
        <header class="p-6 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-auto">
            <h1 id="restaurant-title" class="text-2xl font-black italic tracking-tighter text-white uppercase">Loading...</h1>
            <p id="table-label" class="text-xs font-bold text-orange-500 uppercase tracking-widest mt-1">Scanning Table QR...</p>
        </header>

        <!-- Main Body Content: Dynamic Menu Swapper -->
        <div class="mt-auto pointer-events-auto w-full bg-gradient-to-t from-zinc-950 via-zinc-950/90 to-transparent pb-8 pt-20">
            
            <!-- Category Navigation Tab Bar -->
            <nav id="category-bar" class="px-6 py-2 overflow-x-auto flex gap-2 no-scrollbar mb-4">
                <!-- Injected dynamically via JS -->
            </nav>
            
            <!-- Horizontal Carousel for Menu Items inside active category -->
            <div id="items-carousel" class="px-6 flex gap-4 overflow-x-auto no-scrollbar pb-4 snap-x snap-mandatory">
                <!-- Injected dynamically via JS -->
            </div>
            
            <!-- Bottom Checkout Control Panel -->
            <div class="px-6 max-w-md mx-auto">
                <div class="bg-zinc-900/90 backdrop-blur p-4 rounded-3xl flex justify-between items-center shadow-2xl border border-white/5">
                    <div>
                        <p id="selected-item-name" class="text-xs font-black tracking-wider text-zinc-400 uppercase">Select an item</p>
                        <p id="selected-item-price" class="text-white font-black text-xl">--</p>
                    </div>
                    <button id="order-btn" class="bg-orange-500 hover:bg-orange-600 transition-colors text-white px-8 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-orange-500/20">
                        Order Now
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- AR VIEWPORT LAYER -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <!-- Simple ambient lighting setup for accurate food rendering inside dark/tight contexts -->
        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" position="1 2 1" intensity="1.5"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TABLE 1 VIRTUAL ANCHOR (Target 0) -->
        <a-entity mindar-image-target="targetIndex: 0" id="table-1-anchor">
            <a-gltf-model id="ar-model-t1" src="" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; ease: linear">
            </a-gltf-model>
        </a-entity>

        <!-- TABLE 2 VIRTUAL ANCHOR (Target 1) -->
        <a-entity mindar-image-target="targetIndex: 1" id="table-2-anchor">
            <a-gltf-model id="ar-model-t2" src="" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; ease: linear">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <!-- SYSTEM LOGIC ENGINE -->
    <script>
        let menuData = null;
        let activeCategory = "";
        let selectedItem = null;
        let currentTable = null;

        const overlay = document.getElementById('scanning-overlay');
        const tableLabel = document.getElementById('table-label');
        const modelT1 = document.getElementById('ar-model-t1');
        const modelT2 = document.getElementById('ar-model-t2');

        // 1. Core Fetch: Initialize and build UI out of data.json
        async function initMenu() {
            try {
                const response = await fetch('./data.json');
                menuData = await response.json();
                
                document.getElementById('restaurant-title').innerText = menuData.restaurant;
                
                // Establish initial dynamic Category Tabs
                if (menuData.categories && menuData.categories.length > 0) {
                    activeCategory = menuData.categories[0];
                    renderCategories();
                    renderItems();
                }
            } catch (error) {
                console.error("Error reading your data.json menu configuration:", error);
            }
        }

        function renderCategories() {
            const bar = document.getElementById('category-bar');
            bar.innerHTML = "";
            menuData.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-xl text-[10px] font-black tracking-widest uppercase transition-all duration-200 shrink-0 ${cat === activeCategory ? 'active-tab shadow-lg shadow-orange-500/20' : 'bg-zinc-800/80 border border-zinc-700/50 text-zinc-400'}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderItems();
                };
                bar.appendChild(btn);
            });
        }

        function renderItems() {
            const carousel = document.getElementById('items-carousel');
            carousel.innerHTML = "";
            
            // Filter dishes mapped strictly to selection
            const filteredDishes = menuData.dishes.filter(dish => dish.category === activeCategory);
            
            filteredDishes.forEach((dish, idx) => {
                const card = document.createElement('div');
                card.className = "snap-center shrink-0 w-44 bg-zinc-900/90 border border-zinc-800 p-4 rounded-2xl flex flex-col justify-between shadow-xl cursor-pointer transition-all";
                if(selectedItem && selectedItem.id === dish.id) {
                    card.classList.add("border-orange-500", "bg-zinc-800");
                }
                
                card.innerHTML = `
                    <div>
                        <span class="text-[9px] font-bold tracking-wider px-2 py-0.5 rounded-full ${dish.type === 'veg' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}">${dish.type.toUpperCase()}</span>
                        <h3 class="font-black text-sm text-white mt-2 leading-tight">${dish.name}</h3>
                        <p class="text-xs text-zinc-400 font-medium mt-1">${dish.calories || ''}</p>
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="font-black text-orange-400 text-sm">${menuData.currency || '£'}${dish.price}</span>
                        <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-1 rounded-md font-bold uppercase tracking-tight">Select</span>
                    </div>
                `;
                
                card.onclick = () => {
                    selectDish(dish);
                    renderItems(); // re-render layout highlight
                };
                carousel.appendChild(card);
                
                // Default select the first item on active view switch
                if(idx === 0 && (!selectedItem || selectedItem.category !== activeCategory)) {
                    selectDish(dish);
                }
            });
        }

        // Sets app UI variables and swaps underlying virtual assets inside A-Frame instantly
        function selectDish(dish) {
            selectedItem = dish;
            document.getElementById('selected-item-name').innerText = dish.name;
            document.getElementById('selected-item-price').innerText = `${menuData.currency || '£'}${dish.price}`;
            
            // Point the targets to use your data.json specified asset
            modelT1.setAttribute('src', dish.glb);
            modelT2.setAttribute('src', dish.glb);
            
            // Handle unique spatial scale adjustments cleanly
            const customScale = dish.name.toLowerCase().includes("burger") ? "0.5 0.5 0.5" : "0.4 0.4 0.4";
            modelT1.setAttribute('scale', customScale);
            modelT2.setAttribute('scale', customScale);
        }

        // 2. Dynamic Tracking Hooks
        const t1Anchor = document.querySelector('#table-1-anchor');
        t1Anchor.addEventListener("targetFound", () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            currentTable = "Table 01";
            tableLabel.innerText = `${currentTable} • Live AR Linked`;
        });
        t1Anchor.addEventListener("targetLost", () => handleTargetLoss());

        const t2Anchor = document.querySelector('#table-2-anchor');
        t2Anchor.addEventListener("targetFound", () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            currentTable = "Table 02";
            tableLabel.innerText = `${currentTable} • Live AR Linked`;
        });
        t2Anchor.addEventListener("targetLost", () => handleTargetLoss());

        function handleTargetLoss() {
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; }, 5);
            tableLabel.innerText = "Scanning Table QR...";
            currentTable = null;
        }

        // 3. Checkout Button Context Binding
        document.getElementById('order-btn').addEventListener('click', () => {
            if(!currentTable) {
                alert("Please align your view directly over your table's QR sticker to lock system tracking data.");
                return;
            }
            if(!selectedItem) return;
            
            alert(`Order Placed!\nDish: ${selectedItem.name}\nTable: ${currentTable}\nPrice: ${menuData.currency || '£'}${selectedItem.price}`);
        });

        // Fire on startup
        initMenu();
    </script>
</body>
</html>
