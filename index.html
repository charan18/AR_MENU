<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stable AR Test</title>
    <!-- Core Framework Stack -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Keep viewport clean and ensure camera fills screen background */
        body { margin: 0; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white antialiased">

    <!-- ==================== STABLE AR VIEWPORT ==================== -->
    <!-- AutoStart is true: MindAR handles the camera initialization immediately on page load -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;" 
        embedded 
        loading-screen="enabled: false"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Hardcoded asset link to prevent injection timing failures -->
            <a-asset-item id="burger-model" src="models/burger.glb"></a-asset-item>
        </a-assets>
        
        <!-- Standard Cinematic Lighting -->
        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- SINGLE TARGET PROTOTYPE (Target Index 0 = Table 1) -->
        <a-entity mindar-image-target="targetIndex: 0" id="table-target">
            <!-- Completely static, realistic scale, slightly raised on Z axis -->
            <a-gltf-model 
                src="#burger-model" 
                position="0 0 0.1" 
                scale="0.5 0.5 0.5" 
                rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <!-- ==================== MINIMALIST TEXT OVERLAY ==================== -->
    <div class="absolute bottom-10 left-0 right-0 mx-auto text-center z-50 pointer-events-none">
        <div class="inline-block bg-black/80 backdrop-blur px-6 py-3 rounded-2xl border border-white/10 shadow-xl">
            <h1 class="text-sm font-black tracking-wider uppercase text-orange-500">AR Diagnostic Mode</h1>
            <p class="text-[11px] text-zinc-400 mt-1">Point your camera at the Table 1 QR Target Image</p>
        </div>
    </div>

</body>
</html>
